[workspace]
resolver = "3"
members = ["crates/ir", "crates/lang-java", "crates/lang-ts", "crates/scip", "crates/classify", "crates/git", "crates/core", "crates/cli"]
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
scip = "0.5"
protobuf = "3"
tree-sitter = "0.25"
tree-sitter-java = "0.23.5"
tree-sitter-typescript = "0.23"
rayon = "1"
libc = "0.2"
ignore = "0.4"
