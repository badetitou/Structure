[workspace]
resolver = "3"
members = [
    "crates/ir",
    "crates/lang-java",
    "crates/lang-ts",
    "crates/lang-pharo",
    "crates/lang",
    "crates/scip",
    "crates/classify",
    "crates/highlight",
    "crates/git",
    "crates/core",
    "crates/cli",
    "crates/wasm",
]
exclude = ["app"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.100"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
scip = "0.10"
protobuf = "3"
tree-sitter = "0.27"
tree-sitter-java = "0.23.5"
tree-sitter-typescript = "0.23"
rayon = "1"
libc = "0.2"
ignore = "0.4"
wasm-bindgen = "0.2"
ts-rs = "12"
model-core = "0.5"
model-scip = "0.5"
model-link = "0.5"
