[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
scip = "0.5"
protobuf = "3"
