<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Structure viewer</title>
    <script>
      // Set the theme before first paint; mirrors mode-watcher (key "mode-watcher-mode": light | dark | system).
      (function () {
        try {
          var m = localStorage.getItem("mode-watcher-mode");
          var dark = m === "dark" || (m !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          r.classList.toggle("dark", dark);
          r.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/viewer/boot.ts"></script>
  </body>
</html>
