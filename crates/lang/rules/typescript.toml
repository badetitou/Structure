# TypeScript classification rules (Angular, NestJS). First match wins.

# --- Layers (matrix rows, top to bottom by `order`; `unknown` is implicit, last) ---
[[layer]]
id = "ui"
label = "ui"
order = 0

[[layer]]
id = "state"
label = "state"
order = 1

[[layer]]
id = "api_client"
label = "api_client"
order = 2

[[layer]]
id = "entry"
label = "entry"
order = 3

[[layer]]
id = "business"
label = "business"
order = 4

[[layer]]
id = "persistence"
label = "persistence"
order = 5

[[layer]]
id = "model"
label = "model"
order = 6

[[layer]]
id = "util"
label = "util"
order = 7

# --- NestJS ---
[[rule]]
layer = "entry"
any_annotation = ["Controller"]

[[rule]]
layer = "model"
any_annotation = ["Entity"]

# --- Angular ---
[[rule]]
layer = "ui"
any_annotation = ["Component"]

[[rule]]
layer = "util"
any_annotation = ["Directive", "Pipe"]

# Guards, interceptors, resolvers (usually @Injectable, but not business logic)
[[rule]]
layer = "util"
name_suffix = ["Guard", "Interceptor", "Resolver"]

[[rule]]
layer = "util"
path_contains = ["/guards/", "/interceptors/"]

[[rule]]
layer = "api_client"
any_annotation = ["Injectable"]
uses = ["HttpClient"]

[[rule]]
layer = "state"
any_annotation = ["Injectable"]
name_suffix = ["Store", "State", "StoreService", "StateService"]

[[rule]]
layer = "state"
any_annotation = ["Injectable"]
uses = ["BehaviorSubject", "ReplaySubject"]

# NestJS repositories
[[rule]]
layer = "persistence"
any_annotation = ["Injectable"]
uses = ["Repository", "EntityManager", "DataSource"]

[[rule]]
layer = "business"
any_annotation = ["Injectable"]

# --- Models ---
[[rule]]
layer = "model"
kind = ["interface", "enum"]
path_contains = ["/models/", "/model/"]

[[rule]]
layer = "model"
path_contains = [".model.ts", ".entity.ts", ".dto.ts"]

[domain]
strategy = "auto"
after = "src/app/"
skip_segments = ["features", "feature", "shared", "core", "modules", "pages"]
strip_suffixes = ["Component", "Service", "Store", "State", "Guard", "Interceptor", "Controller", "Module"]
fallback = "misc"
