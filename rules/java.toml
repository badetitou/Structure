# Java classification rules. First matching rule wins (file order).
# Matchers within a rule are ANDed; each matcher is "any of" its list.

# --- Stripes ---
[[rule]]
layer = "entry"
any_supertype = ["ActionBean"]

[[rule]]
layer = "entry"
name_suffix = ["ActionBean"]

# --- Spring ---
[[rule]]
layer = "entry"
any_annotation = ["RestController", "Controller", "DgsComponent"]

[[rule]]
layer = "business"
any_annotation = ["Service"]

[[rule]]
layer = "persistence"
any_annotation = ["Repository"]

[[rule]]
layer = "model"
any_annotation = ["Entity", "Embeddable"]

[[rule]]
layer = "util"
any_annotation = ["Configuration"]

# Web configuration/listeners must not fall into the `.web.` catch-all below.
[[rule]]
layer = "util"
package_contains = [".web.configuration.", ".web.config.", ".configuration.", ".config."]

# --- MyBatis ---
# @Mapper on an interface is MyBatis; on a class it is a MapStruct converter.
[[rule]]
layer = "persistence"
kind = ["interface"]
any_annotation = ["Mapper"]

[[rule]]
layer = "util"
kind = ["class"]
any_annotation = ["Mapper"]

[[rule]]
layer = "persistence"
kind = ["interface"]
name_suffix = ["Mapper"]

# --- JPA / Spring Data ---
[[rule]]
layer = "persistence"
any_supertype = ["JpaRepository", "CrudRepository", "PagingAndSortingRepository", "ListCrudRepository"]

# By convention an interface named *Repository is a persistence port (DDD / Spring).
[[rule]]
layer = "persistence"
kind = ["interface"]
name_suffix = ["Repository"]

# --- Package conventions ---
[[rule]]
layer = "model"
package_contains = [".domain.", ".model.", ".dto."]

[[rule]]
layer = "entry"
package_contains = [".web.", ".controller.", ".controllers."]

[[rule]]
layer = "business"
package_contains = [".service.", ".services."]

[[rule]]
layer = "persistence"
package_contains = [".mapper.", ".repository.", ".dao."]

[[rule]]
layer = "util"
any_annotation = ["Component"]

# Technical classes in a `core` package are not domain model; first match wins,
# so this must stay above the model rule below.
[[rule]]
layer = "util"
package_contains = [".core."]
name_suffix = ["Exception", "Utils", "Util", "Configuration", "Config"]

# Plain classes in a `core` package (hexagonal / DDD core) are the domain model.
# Last package rule: role packages (`core.service` stays business) and annotations win.
[[rule]]
layer = "model"
kind = ["class"]
package_contains = [".core."]

# --- Sinks: classes talking to a database API ---
[[rule]]
layer = "persistence"
uses = ["JdbcTemplate", "EntityManager", "SqlSession", "SqlSessionTemplate"]

[domain]
strategy = "auto"
# Longest first: only the first matching suffix is stripped.
strip_suffixes = ["QueryService", "CommandService", "ReadService", "ServiceImpl", "ActionBean", "Datafetcher", "Controller", "Repository", "Component", "Mutation", "Service", "Mapper", "Api", "Dao", "DAO"]
strip_prefixes = ["MyBatis", "Default", "Jpa", "Abstract"]
singularize = true
fallback = "misc"

[domain.aliases]
catalog = ["category", "product", "item"]
order = ["lineitem", "sequence"]
account = ["account"]
cart = ["cart", "cartitem"]
