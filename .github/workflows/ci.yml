# Checks every pull request and every push to main: Rust (fmt, clippy, tests)
# and the UI (vitest, svelte-check). Fixture-based tests skip here (no
# fixtures/ in CI). Not covered: the Tauri app (app/src-tauri needs webkit
# system libraries) and the wasm build (scripts/build-wasm.sh, run by
# extension-release.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests
        run: npx vitest run

      - name: Svelte check
        run: npm run check
